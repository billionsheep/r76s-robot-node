name: R76S U-Boot and loader

# 提交文件只让这个入口出现；由用户看过文件后亲自启动。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r76s-uboot
  cancel-in-progress: false

jobs:
  uboot:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cloud build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev device-tree-compiler cpio lz4 \
            xz-utils curl git time
      - name: Build and inspect RK3576 boot components
        shell: bash
        run: bash system/ci/build-uboot.sh
      - name: Save boot components and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r76s-uboot-${{ github.run_id }}
          path: artifacts/uboot/
          retention-days: 1
          if-no-files-found: warn
