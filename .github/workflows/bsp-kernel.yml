name: R76S kernel and DTB

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r76s-kernel
  cancel-in-progress: false

jobs:
  kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cloud build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev device-tree-compiler cpio lz4 \
            xz-utils curl git time
      - name: Build official kernel and R76S device tree
        shell: bash
        run: bash system/ci/build-kernel.sh
      - name: Save build outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: r76s-kernel-${{ github.run_id }}
          path: artifacts/
          retention-days: 1
          if-no-files-found: warn
          include-hidden-files: true
