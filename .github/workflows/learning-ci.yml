name: Learning CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['edge-agent/**', 'tests/**', '.github/workflows/learning-ci.yml']
  pull_request:
    paths: ['edge-agent/**', 'tests/**', '.github/workflows/learning-ci.yml']

permissions:
  contents: read

concurrency:
  group: learning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile-and-check:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install cloud cross compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: Compile and verify
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build artifacts
          gcc -std=c11 -Wall -Wextra -Werror -O2 edge-agent/main.c -o build/edge-agent-native
          python3 tests/check-edge-agent.py build/edge-agent-native | tee artifacts/test-result.txt
          aarch64-linux-gnu-gcc -std=c11 -Wall -Wextra -Werror -O2 edge-agent/main.c -o artifacts/edge-agent-aarch64
          aarch64-linux-gnu-readelf -h artifacts/edge-agent-aarch64 | tee artifacts/elf-header.txt
          grep -q 'Machine:.*AArch64' artifacts/elf-header.txt
          {
            gcc --version | head -n 1
            aarch64-linux-gnu-gcc --version | head -n 1
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ARM64 binary compiled; board execution not tested in this run.\n'
          } > artifacts/build-info.txt
          (cd artifacts && sha256sum edge-agent-aarch64 > SHA256SUMS)
      - name: Save small learning artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-agent-aarch64-${{ github.run_id }}
          path: artifacts/
          retention-days: 1
          if-no-files-found: error
